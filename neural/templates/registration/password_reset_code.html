<div style="font-family:'Cabin',Arial,Helvetica,sans-serif;background:#f4f4f7;padding:32px 16px;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e6e6ec;">
    <div style="background:#1a1a2e;padding:26px 24px;text-align:center;">
      <p style="margin:0;color:#f5a623;font-size:12px;letter-spacing:.18em;text-transform:uppercase;">Neural</p>
      <h1 style="margin:4px 0 0;color:#ffffff;font-size:24px;">Consciente</h1>
    </div>
    <div style="padding:28px 24px;color:#171717;">
      <h2 style="margin:0 0 10px;font-size:18px;">Tu código para recuperar la contraseña</h2>
      <p style="margin:0 0 22px;font-size:15px;line-height:1.5;color:#555;">
        Escribilo en la app para elegir una contraseña nueva.
      </p>
      <p style="margin:0 0 22px;text-align:center;">
        <span style="display:inline-block;padding:16px 28px;background:#f4f4f7;border-radius:12px;font-family:'Courier New',monospace;font-size:34px;font-weight:bold;letter-spacing:10px;color:#1a1a2e;">{{ code }}</span>
      </p>
      <p style="margin:0;font-size:13px;line-height:1.55;color:#888;border-top:1px solid #eee;padding-top:16px;">
        Vence en {{ minutes }} minutos y se usa una sola vez.<br>
        Si no lo pediste, ignorá este correo: tu contraseña no cambia sola.
      </p>
    </div>
  </div>
</div>
